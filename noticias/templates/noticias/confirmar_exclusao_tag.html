{% extends 'base.html' %}

{% block content %}
<h2>Confirmar Exclusão de Tag</h2>

<p class="mt-3">Tem certeza que deseja excluir a tag <strong>{{ tag.nome }}</strong>?</p>

<form method="post">
  {% csrf_token %}[cite: 2]
  <button type="submit" class="btn btn-danger">Confirmar exclusão</button>
  <a href="{% url 'listar_tags' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
