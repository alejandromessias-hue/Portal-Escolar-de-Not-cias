{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Gerenciamento de Tags</h2>
  <a href="{% url 'criar_tag' %}" class="btn btn-primary">Nova Tag</a>
</div>

<table class="table table-bordered">
  <thead class="table-dark">
    <tr>
      <th>ID</th>
      <th>Nome</th>
      <th>Ações</th>
    </tr>
  </thead>
  <tbody>
    {% for tag in tags %}
      <tr>
        <td>{{ tag.id }}</td>
        <td>{{ tag.nome }}</td>
        <td>
          <a href="{% url 'editar_tag' tag.pk %}" class="btn btn-sm btn-warning">Editar</a>
          <a href="{% url 'excluir_tag' tag.pk %}" class="btn btn-sm btn-danger">Excluir</a>
        </td>
      </tr>
    {% empty %}
      <tr>
        <td colspan="3" class="text-center">Nenhuma tag cadastrada.</td>
      </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
