{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Gerenciamento de Categorias</h2>
  <a href="{% url 'criar_categoria' %}" class="btn btn-primary">Nova Categoria</a>
</div>

<table class="table table-bordered">
  <thead class="table-dark">
    <tr>
      <th>ID</th>
      <th>Nome</th>
      <th>Ações</th>
    </tr>
  </thead>
  <tbody>
    {% for categoria in categorias %}
      <tr>
        <td>{{ categoria.id }}</td>
        <td>{{ categoria.nome }}</td>
        <td>
          <a href="{% url 'editar_categoria' categoria.pk %}" class="btn btn-sm btn-warning">Editar</a>
          <a href="{% url 'excluir_categoria' categoria.pk %}" class="btn btn-sm btn-danger">Excluir</a>
        </td>
      </tr>
    {% empty %}
      <tr>
        <td colspan="3" class="text-center">Nenhuma categoria cadastrada.</td>
      </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
